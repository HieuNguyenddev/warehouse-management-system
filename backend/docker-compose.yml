name: warehouse-backend

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: warehouse-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Đặt MSSQL_SA_PASSWORD trong backend/.env}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - warehouse-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-api
    ports:
      - "${API_HTTP_PORT:-5161}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${MSSQL_DATABASE:-WarehouseDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Database__ApplyMigrations: "true"
      Cors__Origins: ${CORS_ORIGINS:-http://localhost:3000}
      Jwt__Issuer: ${Jwt__Issuer:-warehouse}
      Jwt__Audience: ${Jwt__Audience:-warehouse-admin}
      Jwt__SigningKey: ${Jwt__SigningKey:?Đặt Jwt__SigningKey trong backend/.env}
      Jwt__ExpiresMinutes: ${Jwt__ExpiresMinutes:-480}
      Auth__SeedEmail: ${Auth__SeedEmail:-}
      Auth__SeedPassword: ${Auth__SeedPassword:-}
      Auth__SeedName: ${Auth__SeedName:-Quản trị}
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  warehouse-sqlserver:
    name: warehouse-sqlserver
